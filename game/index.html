<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copper Ladle — Rush Hour Kitchen</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #241a12; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Copper Ladle, a rush hour cooking game: take an order ticket, fetch ingredients from the bins, chop on the board, grill on the stove, build the dish on a plate and serve it at the pass before the ticket's patience runs out"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./js/main.js"></script>
</body>
</html>
